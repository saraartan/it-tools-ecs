name: Terraform Deploy

on:
  workflow_run:
    workflows: ["Build and Push Image"]
    types: [completed]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: it-tools

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Format, Validate & Apply
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::712607540523:role/it-tools-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Determine image tag
        id: image
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=712607540523.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:$SHA" >> "$GITHUB_OUTPUT"

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var="hosted_zone_id=Z05194711E3CA9BU0P1X3" \
            -var="container_image=${{ steps.image.outputs.tag }}"

  post-deploy-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 45

      - name: Check health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://tools.saraartan.com/health)
          echo "Health check returned: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed!"
            exit 1
          fi
          echo "Health check passed!"
