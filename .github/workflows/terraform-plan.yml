name: Terraform Plan

on:
  workflow_run:
    workflows: ["Build and Push Image"]
    types: [completed]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: it-tools

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Format, Validate, Scan & Plan
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::712607540523:role/it-tools-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Run tfsec security scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ./terraform
          soft_fail: true

      - name: Determine image tag
        id: image
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=712607540523.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA" > /tmp/image_sha.txt

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan -out=tfplan \
            -var="hosted_zone_id=Z05194711E3CA9BU0P1X3" \
            -var="container_image=${{ steps.image.outputs.tag }}"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            terraform/tfplan
            /tmp/image_sha.txt
          retention-days: 1
